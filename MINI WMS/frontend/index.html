<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mini WMS - Gestão de Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8">
  <div class="max-w-6xl mx-auto space-y-8">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-3xl font-bold text-sky-400">Mini WMS</h1>
      <p class="text-slate-400 text-sm">Controle de Estoque e Operações Logísticas</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total de Produtos</span>
        <p id="totalProdutos" class="text-3xl font-bold text-white mt-2">0</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Peças em Estoque</span>
        <p id="totalEstoque" class="text-3xl font-bold text-emerald-400 mt-2">0</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Abaixo do Mínimo</span>
        <p id="abaixoMinimo" class="text-3xl font-bold text-rose-400 mt-2">0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <section class="bg-slate-800 p-6 rounded-lg border border-slate-700 space-y-4">
        <h2 class="text-lg font-semibold text-sky-300">Novo Produto</h2>
        <div class="space-y-3">
          <input id="sku" placeholder="SKU (ex: PAL-001)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-sky-500 text-white">
          <input id="nome" placeholder="Nome do Produto" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          <input id="categoria" placeholder="Categoria" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          <div class="grid grid-cols-2 gap-3">
            <input id="preco" type="number" step="0.01" placeholder="Preço (R$)" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
            <input id="estoqueMinimo" type="number" placeholder="Estoque Mínimo" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          </div>
          <button onclick="cadastrarProduto()" class="w-full bg-sky-600 hover:bg-sky-500 font-medium py-2 rounded transition text-white">Cadastrar</button>
        </div>
      </section>

      <section class="bg-slate-800 p-6 rounded-lg border border-slate-700 space-y-4">
        <h2 class="text-lg font-semibold text-sky-300">Movimentar Estoque</h2>
        <div class="space-y-3">
          <select id="selectProduto" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300">
            <option value="">Selecione um Produto...</option>
          </select>
          <select id="tipoMovimento" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-300">
            <option value="ENTRADA">Entrada (+)</option>
            <option value="SAIDA">Saída (-)</option>
          </select>
          <input id="qtdMovimento" type="number" min="1" placeholder="Quantidade" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
          <button onclick="registrarMovimento()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-2 rounded transition text-white">Registrar Operação</button>
        </div>
      </section>
    </div>

    <section class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">Itens em Estoque</h2>
        <button onclick="carregarDados()" class="text-xs text-sky-400 hover:underline">Atualizar</button>
      </div>
      <table class="w-full text-left text-sm text-slate-300">
        <thead class="bg-slate-900/60 text-slate-400 text-xs uppercase">
          <tr>
            <th class="p-4">SKU</th>
            <th class="p-4">Produto</th>
            <th class="p-4">Categoria</th>
            <th class="p-4">Preço</th>
            <th class="p-4">Qtd</th>
            <th class="p-4">Mínimo</th>
            <th class="p-4">Status</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo" class="divide-y divide-slate-700"></tbody>
      </table>
    </section>
  </div>

  <script>
    const API = 'http://localhost:8080/api/produtos';

    async function carregarDados() {
      try {
        const res = await fetch(API);
        const produtos = await res.json();
        
        let totalQtd = 0;
        let abaixoMin = 0;
        const corpo = document.getElementById('tabelaCorpo');
        const select = document.getElementById('selectProduto');
        
        corpo.innerHTML = '';
        select.innerHTML = '<option value="">Selecione um Produto...</option>';

        produtos.forEach(p => {
          totalQtd += p.quantidade;
          const statusCritico = p.quantidade <= p.estoqueMinimo;
          if (statusCritico) abaixoMin++;

          corpo.innerHTML += `
            <tr class="hover:bg-slate-700/50">
              <td class="p-4 font-mono font-semibold text-sky-300">${p.sku}</td>
              <td class="p-4">${p.nome}</td>
              <td class="p-4">${p.categoria}</td>
              <td class="p-4">R$ ${Number(p.preco).toFixed(2)}</td>
              <td class="p-4 font-bold ${statusCritico ? 'text-rose-400' : 'text-emerald-400'}">${p.quantidade}</td>
              <td class="p-4 text-slate-400">${p.estoqueMinimo}</td>
              <td class="p-4">
                <span class="px-2 py-1 text-xs rounded font-medium ${statusCritico ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}">
                  ${statusCritico ? 'Crítico' : 'Normal'}
                </span>
              </td>
            </tr>`;

          select.innerHTML += `<option value="${p.id}">${p.sku} - ${p.nome} (Atual: ${p.quantidade})</option>`;
        });

        document.getElementById('totalProdutos').innerText = produtos.length;
        document.getElementById('totalEstoque').innerText = totalQtd;
        document.getElementById('abaixoMinimo').innerText = abaixoMin;
      } catch (err) {
        console.error('Falha ao comunicar com a API backend:', err);
      }
    }

    async function cadastrarProduto() {
      const payload = {
        sku: document.getElementById('sku').value,
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value,
        preco: parseFloat(document.getElementById('preco').value) || 0,
        estoqueMinimo: parseInt(document.getElementById('estoqueMinimo').value) || 0
      };

      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('sku').value = '';
      document.getElementById('nome').value = '';
      document.getElementById('categoria').value = '';
      document.getElementById('preco').value = '';
      document.getElementById('estoqueMinimo').value = '';

      carregarDados();
    }

    async function registrarMovimento() {
      const id = document.getElementById('selectProduto').value;
      const tipo = document.getElementById('tipoMovimento').value;
      const quantidade = parseInt(document.getElementById('qtdMovimento').value);

      if (!id || !quantidade) return;

      const res = await fetch(`${API}/${id}/movimentar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, quantidade })
      });

      if (!res.ok) {
        alert(await res.text());
        return;
      }

      document.getElementById('qtdMovimento').value = '';
      carregarDados();
    }

    carregarDados();
  </script>
</body>
</html>
